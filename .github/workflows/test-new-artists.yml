
name: Test new artists

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check DNS and HTTP
        run: |
          python - <<'PY'
          import socket
          import requests

          sites = {
              "Kizu": "https://ki-zu.com/schedule/",
              "The Poraliscope": "https://poraliscope.bitfan.id/schedules/menu/76259",
              "GitHub": "https://github.com",
          }

          for name, url in sites.items():
              host = requests.utils.urlparse(url).hostname
              print(f"\n=== {name}: {host} ===", flush=True)

              try:
                  addresses = sorted({
                      item[4][0]
                      for item in socket.getaddrinfo(host, 443)
                  })
                  print("DNS OK:", addresses, flush=True)
              except Exception as e:
                  print("DNS ERROR:", repr(e), flush=True)
                  continue

              try:
                  response = requests.get(url, timeout=15)
                  print("HTTP:", response.status_code, flush=True)
                  print("Final URL:", response.url, flush=True)
              except Exception as e:
                  print("HTTP ERROR:", repr(e), flush=True)
          PY
