
name: Test new artists

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test both artists
        run: |
          python - <<'PY'
          from kizu import fetch_kizu
          from poraliscope import fetch_poraliscope

          artists = [
              (
                  "キズ",
                  fetch_kizu,
                  {
                      "id": "kizu",
                      "name": "キズ",
                      "url": "https://www.ki-zu.com/schedule/",
                  },
              ),
              (
                  "The Poraliscope",
                  fetch_poraliscope,
                  {
                      "id": "poraliscope",
                      "name": "The Poraliscope",
                      "url": "https://poraliscope.bitfan.id/contents/menu/76258",
                  },
              ),
          ]

          failed = False

          for name, fetch, artist in artists:
              print(f"\n=== {name} ===", flush=True)

              try:
                  events = fetch(artist)
                  print(f"取得件数: {len(events)}", flush=True)

                  if not events:
                      print("ERROR: 取得件数が0件です")
                      failed = True

                  for event in events:
                      print(
                          event["start"],
                          event["title"],
                          "|",
                          event["location"],
                          flush=True,
                      )

              except Exception as error:
                  print("ERROR:", repr(error), flush=True)
                  failed = True

          if failed:
              raise SystemExit(1)
          PY
