
name: Test new artists

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inspect Poraliscope live details
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup

          urls = [
              "https://poraliscope.bitfan.id/contents/450192",
              "https://poraliscope.bitfan.id/contents/457451",
              "https://poraliscope.bitfan.id/contents/465304",
              "https://poraliscope.bitfan.id/contents/467393",
          ]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0",
              "Accept": "text/html",
          })

          for url in urls:
              print(f"\n=== {url} ===", flush=True)
              try:
                  response = session.get(url, timeout=25)
                  print("HTTP:", response.status_code)
                  response.raise_for_status()

                  soup = BeautifulSoup(
                      response.text, "html.parser"
                  )
                  for tag in soup(["script", "style", "nav", "footer"]):
                      tag.decompose()

                  lines = [
                      re.sub(r"\s+", " ", line).strip()
                      for line in soup.get_text("\n").splitlines()
                  ]
                  lines = [line for line in lines if line]

                  keywords = (
                      "2026", "2027", "OPEN", "START",
                      "開場", "開演", "会場", "出演",
                      "FOWS", "ReG", "LIVEHOLIC",
                  )

                  for index, line in enumerate(lines):
                      if any(word in line for word in keywords):
                          print(
                              " | ".join(
                                  lines[max(0, index-1):index+3]
                              )[:400],
                              flush=True,
                          )
              except Exception as error:
                  print("ERROR:", repr(error), flush=True)
          PY
