
name: Test new artists

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test Kizu and The Poraliscope
        run: |
          python - <<'PY'
          from kizu import fetch_kizu
          from poraliscope import fetch_poraliscope

          artists = [
              {
                  "id": "kizu",
                  "name": "キズ",
                  "url": "https://ki-zu.com/schedule/",
                  "fetch": fetch_kizu,
              },
              {
                  "id": "poraliscope",
                  "name": "The Poraliscope",
                  "url": "https://poraliscope.bitfan.id/schedules/menu/76259",
                  "fetch": fetch_poraliscope,
              },
          ]

          for artist in artists:
              print(f'\n=== {artist["name"]} ===')
              events = artist["fetch"](artist)
              print(f'取得件数: {len(events)}')
              for event in events:
                  print(event["start"], event["title"], event["location"])
          PY
