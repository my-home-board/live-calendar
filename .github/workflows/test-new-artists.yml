
name: Test new artists

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check alternative sources
        run: |
          python - <<'PY'
          import subprocess
          import requests

          print("=== Kizu DNS ===", flush=True)
          for server in ["1.1.1.1", "8.8.8.8"]:
              result = subprocess.run(
                  ["dig", "+time=3", "+tries=1",
                   f"@{server}", "ki-zu.com", "A"],
                  capture_output=True,
                  text=True,
              )
              print(f"\nDNS server: {server}", flush=True)
              print(result.stdout[-1500:], flush=True)
              print(result.stderr[-500:], flush=True)

          sites = {
              "Kizu WWW": "https://www.ki-zu.com/schedule/",
              "Poraliscope NEWS":
                  "https://poraliscope.bitfan.id/contents/menu/76258",
              "Poraliscope HOME":
                  "https://poraliscope.bitfan.id/",
          }

          for name, url in sites.items():
              print(f"\n=== {name} ===", flush=True)
              try:
                  response = requests.get(
                      url,
                      timeout=20,
                      headers={
                          "User-Agent": "Mozilla/5.0",
                          "Accept": "text/html",
                      },
                  )
                  print("HTTP:", response.status_code)
                  print("Final URL:", response.url)
                  print("HTML length:", len(response.content))
              except Exception as error:
                  print("ERROR:", repr(error))
          PY
